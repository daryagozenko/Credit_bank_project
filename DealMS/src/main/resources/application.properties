spring.application.name=DealMS
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/deal_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

app.gozenko.calculator-url=http://localhost:8085/api/v1/calculator
app.gozenko.uri-offers=/offers
app.gozenko.uri-calc=/calc