spring.application.name=DealMS
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/deal_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=app.gozenko.config.EmailMessageSerializer

kafka.topic.finish-registration=finish-registration
kafka.topic.create-documents=create-documents
kafka.topic.send-documents=send-documents
kafka.topic.send-ses=send-ses
kafka.topic.credit-issued=credit-issued
kafka.topic.statement-denied=statement-denied

mail.receiver=gozenkodara80@gmail.com

app.gozenko.calculator-url=http://localhost:8085
app.gozenko.path-offers=/api/v1/calculator/offers
app.gozenko.path-calc=/api/v1/calculator/calc