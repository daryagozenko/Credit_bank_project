spring.application.name=dossier
server.port=8088

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dossier-consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=app.gozenko.config.EmailMessageDeserializer

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gozenkodara80@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.gozenko.deal-url=http://localhost:8086/api/v1/deal
app.gozenko.uri-put-document-status=/admin/statement/{statementId}/status